name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Build Frontend
      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # Build Backend
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # Upload artifacts for deploy job
      - name: Upload frontend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload backend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
          retention-days: 1

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.SERVER_HOST_STAGING }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          # Deploy frontend dist
          rsync -avz --delete dist/ ${{ vars.SERVER_USER_STAGING }}@${{ vars.SERVER_HOST_STAGING }}:${{ vars.DEPLOY_PATH_STAGING }}/dist/

          # Deploy backend (dist + package files for production deps)
          rsync -avz --delete backend/dist/ ${{ vars.SERVER_USER_STAGING }}@${{ vars.SERVER_HOST_STAGING }}:${{ vars.DEPLOY_PATH_STAGING }}/backend/dist/
          rsync -avz backend/package.json backend/package-lock.json ${{ vars.SERVER_USER_STAGING }}@${{ vars.SERVER_HOST_STAGING }}:${{ vars.DEPLOY_PATH_STAGING }}/backend/

          # Install production dependencies and restart on server
          ssh ${{ vars.SERVER_USER_STAGING }}@${{ vars.SERVER_HOST_STAGING }} "cd ${{ vars.DEPLOY_PATH_STAGING }}/backend && npm ci --production && pm2 restart all || pm2 start dist/server.js --name omnichannel-backend"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        run: |
          # Deploy frontend dist
          rsync -avz --delete dist/ ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.DEPLOY_PATH }}/dist/

          # Deploy backend (dist + package files for production deps)
          rsync -avz --delete backend/dist/ ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.DEPLOY_PATH }}/backend/dist/
          rsync -avz backend/package.json backend/package-lock.json ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.DEPLOY_PATH }}/backend/

          # Install production dependencies and restart on server
          ssh ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} "cd ${{ vars.DEPLOY_PATH }}/backend && npm ci --production && pm2 restart all || pm2 start dist/server.js --name omnichannel-backend"
